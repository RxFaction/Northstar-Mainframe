<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Northstar</title>
  <style>
    /* Global theme tokens */
    :root {
      --bg:#0f1117; --panel:#171923; --panel-2:#1e2130;
      --text:#e6e6f0; --muted:#9aa0b4; --accent:#8b5cf6; --accent-2:#22d3ee;
      --danger:#ef4444; --shadow:rgba(0,0,0,.35); --radius:14px;
    }
    *{box-sizing:border-box} html,body{height:100%}
    body{
      margin:0; color:var(--text);
      background: radial-gradient(1200px 1200px at 10% 10%, #121426 0%, #0d0f1a 60%, #090b14 100%),
                  radial-gradient(800px 800px at 90% 0%, rgba(34,211,238,.08), transparent 60%),
                  radial-gradient(900px 900px at 0% 90%, rgba(139,92,246,.08), transparent 60%),
                  var(--bg);
      font:500 16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      display:flex; flex-direction:column; min-height:100vh;
    }

    /* Topbar */
    .topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 20px;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.15));backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid rgba(255,255,255,.06)}
    .brand{display:flex;align-items:center;gap:12px}
    .brand-logo{width:32px;height:32px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 24px rgba(139,92,246,.35)}
    .brand h1{
      margin:0;
      font-size:18px;
      letter-spacing:.4px;
      font-weight:700;
      position:relative;
      color:var(--text);
    }
    .pill{font-size:12px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted)}
    @supports ((-webkit-background-clip:text) or (background-clip:text)){
      .brand h1{
        background:linear-gradient(120deg,var(--accent) 0%,rgba(255,255,255,.95) 45%,var(--accent-2) 100%);
        background-size:220% 220%;
        color:transparent;
        -webkit-background-clip:text;
        background-clip:text;
        animation:brandGlow 7s ease-in-out infinite;
      }
      .brand h1::after{
        content:'';
        position:absolute;
        inset:-2px;
        background:inherit;
        filter:blur(12px);
        opacity:.45;
        pointer-events:none;
        z-index:-1;
      }
    }
    @keyframes brandGlow{
      0%{background-position:0% 50%}
      50%{background-position:100% 50%}
      100%{background-position:0% 50%}
    }

    .btn{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;color:#fff;font-weight:600;background:var(--panel-2);box-shadow:0 4px 16px var(--shadow);transition:transform .06s ease,box-shadow .2s ease,background .2s ease}
    .btn:hover{transform:translateY(-1px);box-shadow:0 8px 26px var(--shadow)}
    .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,.1);color:var(--muted)}

    /* Layout */
    .layout{display:flex;gap:18px;padding:16px 20px;align-items:stretch;flex:1;min-height:0}
    .stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:14px}

    .video-shell{position:relative;width:100%;aspect-ratio:16/9;background:#0b0d16;border-radius:var(--radius);overflow:hidden;box-shadow:0 12px 40px var(--shadow), inset 0 0 0 1px rgba(255,255,255,.04)}
    .video-shell video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0b0d16}

    .live-badge{position:absolute;top:12px;left:12px;display:flex;gap:8px;align-items:center;padding:6px 10px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);border-radius:999px;backdrop-filter:blur(6px)}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 3px rgba(239,68,68,.25)}

    .overlay{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:12px}
    .meta{display:flex;gap:10px;align-items:center;padding:12px;background:var(--panel);border-radius:var(--radius);border:1px solid rgba(255,255,255,.06);box-shadow:0 10px 26px var(--shadow)}
    .meta .title{font-weight:700}
    .settings-wrapper{position:absolute;bottom:18px;right:18px;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
    .icon-btn{width:40px;height:40px;padding:0;border-radius:50%;display:grid;place-items:center}
    .icon-btn svg{width:18px;height:18px;fill:#fff;opacity:.8;transition:opacity .2s ease}
    .icon-btn:hover svg{opacity:1}
    .settings-panel{width:240px;padding:14px;background:var(--panel);border-radius:12px;border:1px solid rgba(255,255,255,.08);box-shadow:0 12px 28px var(--shadow);display:flex;flex-direction:column;gap:12px}
    .settings-panel label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:6px}
    .settings-panel select{width:100%;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#111320;color:var(--text)}

    /* Chat */
    .chat{flex:0 0 360px;max-width:360px;display:flex;flex-direction:column;gap:10px;background:var(--panel);border-radius:var(--radius);padding:12px;box-shadow:0 12px 32px var(--shadow);border:1px solid rgba(255,255,255,.06);min-height:0}
    .chat header{display:flex;justify-content:space-between;align-items:center}
    .chat .messages{flex:1 1 auto;overflow-y:auto;min-height:0;padding-right:4px}
    .chat .messages p{margin:8px 0;padding:8px 10px;background:var(--panel-2);border:1px solid rgba(255,255,255,.05);border-radius:10px}
    .chat form{display:flex;gap:8px}
    .chat input[type="text"]{flex:1;background:#0c0f19;border:1px solid rgba(255,255,255,.08);color:var(--text);padding:10px 12px;border-radius:10px;outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
    .chat button[type="submit"]{padding:10px 14px}

    .hidden{display:none !important}
    .notice{
      margin:12px 20px 0;
      padding:10px 14px;
      border-radius:var(--radius);
      background:rgba(239,68,68,.14);
      border:1px solid rgba(239,68,68,.35);
      color:#fca5a5;
      font-size:14px;
      line-height:1.4;
    }

    @media (max-width:980px){ 
      .layout{flex-direction:column}
      .chat{max-width:100%;flex-basis:auto}
    }

    /* Mobile UI (auto-enabled via JS) */
    body.mobile .topbar{flex-wrap:wrap;gap:10px;padding:10px 14px}
    body.mobile .brand h1{font-size:16px}
    body.mobile .pill{font-size:11px;padding:4px 8px}
    body.mobile .top-actions{width:100%;display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:8px}
    body.mobile .btn{padding:8px 10px;font-size:13px;border-radius:10px}
    body.mobile .layout{padding:12px 12px 16px}
    body.mobile .stage{gap:10px}
    body.mobile .video-shell{aspect-ratio:auto;height:min(56vh, 420px)}
    body.mobile .overlay{left:10px;right:10px;bottom:10px}
    body.mobile .meta{padding:10px}
    body.mobile .chat{max-width:none;min-height:200px;max-height:40vh;overflow:hidden}
    body.mobile .chat .messages{max-height:none}
    body.mobile .chat input[type="text"]{font-size:14px}

    /* Landscape phone: favor video height */
    body.mobile.landscape .video-shell{height:min(50vh, 340px)}
    body.mobile.landscape .chat{max-height:34vh}

    /* Mobile footer spacing (avoid overlapping chat input) */
    body.mobile .layout{padding-bottom:12px}
    body.mobile .chat{margin-bottom:8px}
    body.mobile .footer-note{margin:8px 0 0;padding:0 8px calc(8px + env(safe-area-inset-bottom));font-size:12px}
    body.mobile.keyboard-open .footer-note{display:none}
    .footer-note{margin:24px 0;text-align:center;color:var(--muted);font-size:14px}

  </style>
</head>
<body>
  <!-- Top bar with brand and quick role actions -->
  <nav class="topbar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M12 2l2.4 5.8L21 9.1l-4.6 4 1.2 6.1L12 16.9 6.4 19.2 7.6 13 3 9.1l6.6-1.3L12 2z" fill="white"/>
        </svg>
      </div>
      <h1>Northstar</h1>
      <span class="pill">P2P Streaming</span>
    </div>
    <div class="top-actions">
      <button class="btn ghost" onclick="startViewer()">Join as Viewer</button>
      <button class="btn primary" onclick="startStreamer()">Go Live</button>
      <button class="btn" onclick="stopAll()">Stop</button>
    </div>
  </nav>
  <div class="notice hidden" id="secureWarning">
    Screen sharing requires serving Northstar over <strong>https://</strong>. Enable HTTPS on the host or access it via localhost to share your screen.
  </div>

  <!-- Main layout: stream stage + settings on the left, chat on the right -->
  <main class="layout">
    <section class="stage" aria-label="Stream stage">
      <div class="video-shell">
        <video id="localVideo" autoplay muted playsinline></video>
        <video id="remoteVideo" autoplay playsinline></video>

        <div class="live-badge" id="liveBadge" hidden>
          <span class="dot"></span>
          <strong>LIVE</strong>
          <span class="pill" id="viewerCount">0 viewers</span>
        </div>

      </div>
      <!-- Collapsible settings gear + panel for advanced stream controls -->
      <div class="settings-wrapper">
        <button id="settingsToggle" class="btn icon-btn" type="button" aria-label="Open stream settings" aria-expanded="false" aria-controls="streamSettings">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.4.11-.6l-1.92-3.32c-.12-.21-.38-.3-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.486.486 0 0 0 14.39 2h-3.78c-.24 0-.45.17-.48.4l-.36 2.54c-.59.22-1.14.52-1.63.94l-2.39-.96a.485.485 0 0 0-.6.22L3.23 8.46a.5.5 0 0 0 .11.6l2.03 1.58c-.04.31-.07.64-.07.96 0 .32.03.63.07.94l-2.03 1.58a.5.5 0 0 0-.11.6l1.92 3.32c.12.21.38.3.6.22l2.39-.96c.49.41 1.04.75 1.63.94l.36 2.54c.03.23.24.4.48.4h3.78c.24 0 .45-.17.48-.4l.36-2.54c.59-.22 1.14-.53 1.63-.94l2.39.96c.22.09.48-.01.6-.22l1.92-3.32a.5.5 0 0 0-.11-.6l-2.03-1.58ZM12 15.5c-1.93 0-3.5-1.57-3.5-3.5S10.07 8.5 12 8.5s3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5Z"/>
          </svg>
        </button>
        <div class="settings-panel hidden" id="streamSettings" role="group" aria-label="Stream settings" tabindex="-1">
          <div class="settings-row">
            <label for="qualityProfile">Quality preset
              <select id="qualityProfile" title="Streaming Quality">
                <option value="1080p60">1080p 60fps</option>
                <option value="720p60" selected>720p 60fps (Default)</option>
                <option value="720p30">720p 30fps</option>
              </select>
            </label>
          </div>
          <div class="settings-row">
            <label for="codecProfile">Codec preference
              <select id="codecProfile" title="Codec Preference">
                <option value="auto" selected>Auto Codec</option>
                <option value="vp9">Prefer VP9</option>
                <option value="h264">Prefer H.264</option>
              </select>
            </label>
          </div>
          <div class="settings-row">
            <label for="contentHint">Content hint
              <select id="contentHint" title="Quality Hint">
                <option value="motion">Smoother Motion</option>
                <option value="detail" selected>Sharper Text</option>
              </select>
            </label>
          </div>
        </div>
      </div>
    </section>

    <aside class="chat" aria-label="Live chat">
      <header>
        <strong>Chat</strong>
      </header>
      <div class="messages" id="chatMessages" aria-live="polite"></div>
      <form id="chatForm" autocomplete="off">
        <input type="text" id="chatInput" placeholder="Type a message!" />
        <button type="submit" class="btn primary">Send</button>
      </form>
    </aside>
  </main>

  <p class='footer-note'>Project Northstar v1.0 Beta. Built with WebRTC, WebSocket, and Node.js by RxFaction</p>

  <!-- App logic: WebRTC signaling, capture controls, adaptive quality, and chat -->
  <script>
    /*
     * Runtime model
     * -------------
     * Northstar is one global broadcast, not a room-based service. The streamer
     * owns one RTCPeerConnection per viewer; a viewer owns one connection to the
     * active streamer. Media remains peer-to-peer and never passes through the
     * signaling server.
     *
     * connectionId identifies one RTCPeerConnection lifetime. negotiationId
     * identifies one offer/answer exchange inside that lifetime. Carrying both
     * through signaling prevents delayed answers or ICE candidates from being
     * applied to a replacement connection or the wrong ICE generation.
     */

    // DOM references and UI state
    const localEl  = document.getElementById('localVideo');
    const remoteEl = document.getElementById('remoteVideo');
    const liveBadge = document.getElementById('liveBadge');
    const viewerCountEl = document.getElementById('viewerCount');
    const contentHintSelect = document.getElementById('contentHint');
    const settingsToggle = document.getElementById('settingsToggle');
    const settingsPanel = document.getElementById('streamSettings');
    const codecSelect = document.getElementById('codecProfile');
    const qualitySelect = document.getElementById('qualityProfile');

    const chatForm  = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const chatMessages = document.getElementById('chatMessages');
    const secureWarning = document.getElementById('secureWarning');
    const footerNote = document.querySelector('.footer-note');
    const chatPanel = document.querySelector('.chat');

    // Mobile UI detection (class-based styling)
    const bodyEl = document.body;
    function updateViewportClasses(){
      const isCoarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      const isNarrow = window.innerWidth <= 980;
      const isMobile = isCoarse || isNarrow;
      const isLandscape = window.matchMedia && window.matchMedia('(orientation: landscape)').matches && window.innerHeight <= 520;
      if (isMobile) bodyEl.classList.add('mobile'); else bodyEl.classList.remove('mobile');
      if (isMobile && isLandscape) bodyEl.classList.add('landscape'); else bodyEl.classList.remove('landscape');
      if (footerNote && chatPanel) {
        if (isMobile && footerNote.parentElement !== chatPanel) {
          chatPanel.appendChild(footerNote);
        } else if (!isMobile && footerNote.parentElement !== bodyEl) {
          bodyEl.appendChild(footerNote);
        }
      }
    }
    updateViewportClasses();
    window.addEventListener('resize', updateViewportClasses);
    window.addEventListener('orientationchange', updateViewportClasses);

    // Mobile keyboard handling (iOS Chrome/Safari)
    function updateKeyboardClass(){
      if (!bodyEl.classList.contains('mobile')) {
        bodyEl.classList.remove('keyboard-open');
        return;
      }
      const vv = window.visualViewport;
      if (vv) {
        const delta = window.innerHeight - vv.height;
        if (delta > 120) bodyEl.classList.add('keyboard-open');
        else bodyEl.classList.remove('keyboard-open');
      }
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateKeyboardClass);
      window.visualViewport.addEventListener('scroll', updateKeyboardClass);
    }
    chatInput?.addEventListener('focus', () => bodyEl.classList.add('keyboard-open'));
    chatInput?.addEventListener('blur', () => bodyEl.classList.remove('keyboard-open'));

    // Presets are upper bounds. Each viewer may adapt below its selected ceiling.
    const QUALITY_PROFILES = {
      '1080p60': { width: 1920, height: 1080, frameRate: 60, maxBitrate: 12_000_000, adaptiveFloor: 1_500_000, degradationPreference: 'balanced' },
      '720p60':  { width: 1280, height: 720, frameRate: 60, maxBitrate: 7_000_000,  adaptiveFloor: 1_000_000, degradationPreference: 'balanced' },
      '720p30':  { width: 1280, height: 720, frameRate: 30, maxBitrate: 4_000_000,  adaptiveFloor: 750_000,   degradationPreference: 'balanced' }
    };
    // Optional codec overrides (auto falls back to browser defaults)
    const CODEC_PREFERENCES = {
      auto: null,
      vp9: 'video/VP9',
      h264: 'video/H264'
    };

    // Screen capture is only allowed on HTTPS (or localhost) so warn early
    const SECURE_CONTEXT_OK = window.isSecureContext || ['localhost','127.0.0.1','::1'].includes(window.location.hostname);
    if (!SECURE_CONTEXT_OK && secureWarning) {
      secureWarning.classList.remove('hidden');
    }

    function closeSettingsPanel(){
      if (!settingsPanel || settingsPanel.classList.contains('hidden')) return;
      settingsPanel.classList.add('hidden');
      settingsToggle?.setAttribute('aria-expanded','false');
    }

    // Hide both videos on load
    localEl.classList.add('hidden');
    remoteEl.classList.add('hidden');

    const wsProtocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const socket = new WebSocket(`${wsProtocol}://${window.location.host}`);
    const ICE_DISCONNECT_GRACE_MS = 8_000;
    const ICE_RESTART_RETRY_MS = 15_000;
    const QUALITY_ADAPTATION_INTERVAL_MS = 3_000;
    const QUALITY_ADAPTATION_HEADROOM = 0.85;
    const MAX_PENDING_ICE_CANDIDATES = 128;
    const LEGACY_NEGOTIATION_ID = 'legacy';
    const LEGACY_CONNECTION_ID = 'legacy-connection';
    const LIFECYCLE_STATES = Object.freeze({
      IDLE: 'idle',
      CAPTURING: 'capturing',
      PUBLISHING: 'publishing',
      VIEWING: 'viewing',
      STOPPING: 'stopping'
    });
    const LIFECYCLE_MODES = Object.freeze({
      IDLE: 'idle',
      STREAMER: 'streamer',
      VIEWER: 'viewer'
    });
    // Streamer-owned peer state is keyed by the server-issued viewer ID.
    const peerConnections = new Map();
    const streamerRecoveryTimers = new Map();
    const streamerQualityTimers = new Map();
    // At most one offer-building or ICE-restart task may run per viewer.
    const streamerNegotiationTasks = new Map();
    const pendingStreamerIceRestarts = new Set();
    // Candidate and sender state follows RTCPeerConnection/RTCRtpSender lifetimes.
    const candidateStates = new WeakMap();
    const senderParameterTasks = new WeakMap();
    const senderAdaptationStates = new WeakMap();
    // These maps retain candidates that arrive before their peer object exists.
    const pendingStreamerCandidates = new Map();
    const pendingViewerCandidates = new Map();
    // A small retired-ID history rejects delayed signaling from replaced peers.
    const retiredStreamerConnectionIds = new Map();
    const retiredViewerConnectionIds = new Set();
    let peerConnection;
    let viewerOfferChain = Promise.resolve();
    let viewerOfferEpoch = 0;
    let viewerRecoveryTimer = null;
    let localStream;
    let micStream;
    let role = null;
    let lifecycleState = LIFECYCLE_STATES.IDLE;
    let requestedLifecycleMode = LIFECYCLE_MODES.IDLE;
    let lifecycleTask = null;
    let captureGeneration = 0;
    let activeCaptureGeneration = 0;
    let clientId = null;
    let streamerId = null;
    let requestedViewerConnectionId = null;
    let negotiationCounter = 0;
    let connectionCounter = 0;
    let screenShareAlertShown = false;
    let currentQualityProfile = QUALITY_PROFILES[qualitySelect?.value] || QUALITY_PROFILES['720p60'];
    let currentCodecPreference = codecSelect?.value || 'auto';
    bodyEl.dataset.lifecycleState = lifecycleState;

    function renderViewerCount(total){
      if (!viewerCountEl) return;
      const count = Number.isFinite(total) ? total : 0;
      viewerCountEl.textContent = count === 1 ? '1 viewer' : `${count} viewers`;
    }

    function sendRoleState(){
      if (socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: 'role', role: role || 'unknown' }));
      }
    }

    // Let the streamer adjust resolution/bitrate while live
    qualitySelect?.addEventListener('change', async ()=>{
      currentQualityProfile = QUALITY_PROFILES[qualitySelect.value] || QUALITY_PROFILES['720p60'];
      if (!localStream) return;
      const vTrack = localStream.getVideoTracks()[0];
      if (!vTrack) return;
      await applyQualityConstraints(vTrack, currentQualityProfile);
      if (role === 'streamer') {
        for (const pc of peerConnections.values()) {
          resetSenderAdaptation(pc, currentQualityProfile);
          await tuneSenderParams(pc, currentQualityProfile, vTrack);
        }
      }
    });

    // Prompt streamer to restart if codec preference changes mid-stream
    codecSelect?.addEventListener('change', ()=>{
      currentCodecPreference = codecSelect.value || 'auto';
      if (role === 'streamer') {
        alert('Codec preference updated. Stop and Go Live again to apply the new codec.');
      }
    });
    // Settings gear toggle + dismiss handlers
    settingsToggle?.addEventListener('click', (event)=>{
      event.stopPropagation();
      if (!settingsPanel) return;
      const hidden = settingsPanel.classList.toggle('hidden');
      settingsToggle.setAttribute('aria-expanded', String(!hidden));
      if (!hidden) {
        settingsPanel.focus();
      }
    });
    document.addEventListener('click', (event)=>{
      if (!settingsPanel || settingsPanel.classList.contains('hidden')) return;
      if (settingsPanel.contains(event.target) || settingsToggle?.contains(event.target)) return;
      closeSettingsPanel();
    });
    document.addEventListener('keydown', event=>{
      if (event.key === 'Escape') closeSettingsPanel();
    });


    // WebSocket lifecycle and signaling protocol dispatch
    socket.addEventListener('open', () => {
      console.log('WebSocket connected');
      sendRoleState();
    });
    socket.addEventListener('message', onSocketMessage);

    /*
     * The server owns client IDs and stamps `from`/`to`; the browser owns SDP,
     * connection IDs, and negotiation IDs. Routing guards below deliberately
     * discard signaling that does not belong to the current role or peer.
     */
    async function onSocketMessage(event){
      let raw = event.data; if(raw instanceof Blob) raw = await raw.text();
      const data = JSON.parse(raw);
      if (data.type === 'hello') {
        clientId = data.id || clientId;
        return;
      }
      if (data.type === 'viewerCount') {
        renderViewerCount(data.count);
        return;
      }
      if (data.type === 'streamer-ready') {
        if (data.id) streamerId = data.id;
        if (role === 'viewer') requestOfferFromStreamer();
        return;
      }
      if (data.type === 'streamer-left') {
        if (role === 'viewer') cleanupViewerConnection();
        return;
      }
      if (data.type === 'peer-left') {
        if (role === 'streamer') {
          const viewerId = data.viewerId || data.id;
          if (viewerId) {
            closeStreamerPeer(viewerId);
            retiredStreamerConnectionIds.delete(viewerId);
          }
        }
        return;
      }
      if (data.type === 'streamer-offline') {
        return;
      }

      if (data.type === 'offer') {
        if (role !== 'viewer') return;
        if (data.to && clientId && data.to !== clientId) return;
        streamerId = data.from || streamerId;
        await queueViewerOffer(data.offer, {
          iceRestart: data.iceRestart === true,
          negotiationId: data.negotiationId,
          connectionId: data.connectionId
        });
        return;
      }
      if (data.type === 'answer') {
        if (role !== 'streamer') return;
        const viewerId = data.from || data.viewerId;
        if (!viewerId) return;
        const pc = peerConnections.get(viewerId);
        if (!pc) return;
        const connectionId = normalizeConnectionId(
          data.connectionId || pc.northstarConnectionId
        );
        if (
          data.connectionId
          && pc.northstarConnectionId
          && connectionId !== pc.northstarConnectionId
        ) {
          console.warn(`Ignoring answer from an old connection for viewer ${viewerId}`);
          return;
        }
        const negotiationId = normalizeNegotiationId(
          data.negotiationId || pc.northstarNegotiationId
        );
        if (
          data.negotiationId
          && pc.northstarNegotiationId
          && negotiationId !== pc.northstarNegotiationId
        ) {
          console.warn(`Ignoring stale answer for viewer ${viewerId}`);
          return;
        }
        if (pc.signalingState !== 'have-local-offer') {
          console.warn('Ignoring unexpected answer in state', pc.signalingState);
          return;
        }
        try {
          await setRemoteDescriptionAndDrainCandidates(
            pc,
            new RTCSessionDescription(data.answer),
            `viewer ${viewerId}`,
            negotiationId,
            connectionId
          );
          pc.northstarNegotiationInProgress = false;
          pc.northstarNegotiationKind = null;
          if (pendingStreamerIceRestarts.delete(viewerId)) {
            await restartStreamerIce(viewerId, pc);
          }
        } catch (err) {
          console.warn('Failed to apply remote answer', err);
        }
        return;
      }
      if (data.type === 'request-offer') {
        if (role === 'streamer' && localStream) {
          const viewerId = data.viewerId || data.from;
          if (!viewerId) return;
          const pc = peerConnections.get(viewerId);
          if (data.iceRestart === true && pc && pc.signalingState !== 'closed') {
            if (!candidateBelongsToConnection(data.connectionId, pc)) {
              console.warn(`Ignoring ICE restart request from an old connection for viewer ${viewerId}`);
              return;
            }
            await restartStreamerIce(viewerId, pc);
          } else {
            await buildAndSendOfferForViewer(viewerId, {
              requestedConnectionId: data.connectionId
            });
          }
        }
        return;
      }
      if (data.type === 'candidate') {
        if (role === 'streamer') {
          const viewerId = data.from || data.viewerId;
          if (!viewerId) return;
          const pc = peerConnections.get(viewerId);
          if (!candidateBelongsToConnection(data.connectionId, pc)) {
            console.warn(`Ignoring ICE candidate from an old connection for viewer ${viewerId}`);
            return;
          }
          await receiveRemoteCandidate({
            candidateInit: data.candidate,
            label: `viewer ${viewerId}`,
            pc,
            pendingCandidates: pendingStreamerCandidates,
            peerId: viewerId,
            negotiationId: data.negotiationId,
            connectionId: data.connectionId
          });
          return;
        }
        if (role === 'viewer') {
          if (data.to && clientId && data.to !== clientId) return;
          if (streamerId && data.from && data.from !== streamerId) return;
          const sourceId = data.from || streamerId;
          if (!sourceId) return;
          if (!candidateBelongsToConnection(data.connectionId, peerConnection)) {
            console.warn(`Ignoring ICE candidate from an old connection for streamer ${sourceId}`);
            return;
          }
          await receiveRemoteCandidate({
            candidateInit: data.candidate,
            label: `streamer ${sourceId}`,
            pc: peerConnection,
            pendingCandidates: pendingViewerCandidates,
            peerId: sourceId,
            negotiationId: data.negotiationId,
            connectionId: data.connectionId
          });
          return;
        }
      }
      if (data.type === 'chat') { appendMessage(data.message); }
    }

    // Viewer peer: receives tracks and answers offers from the active streamer.
    function createViewerPeerConnection(targetId, connectionId){
      const pc = new RTCPeerConnection({
        iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }]
      });
      pc.northstarConnectionId = normalizeConnectionId(connectionId);
      pc.onicecandidate = (event)=>{
        if(event.candidate && targetId){
          socket.send(JSON.stringify({
            type:'candidate',
            candidate:event.candidate,
            negotiationId: pc.northstarNegotiationId,
            connectionId: pc.northstarConnectionId,
            to: targetId,
            from: clientId
          }));
        }
      };
      pc.ontrack = (event)=>{
        let inboundStream = remoteEl.srcObject;
        if (!(inboundStream instanceof MediaStream)) {
          inboundStream = new MediaStream();
        }
        if (!inboundStream.getTracks().includes(event.track)) {
          inboundStream.addTrack(event.track);
        }
        remoteEl.srcObject = inboundStream;
        remoteEl.classList.remove('hidden');
        localEl.classList.add('hidden');
        liveBadge.hidden = (role !== 'viewer');
        const playPromise = remoteEl.play?.();
        if (playPromise && typeof playPromise.then === 'function') {
          playPromise.catch(()=>{});
        }
      };
      pc.oniceconnectionstatechange = ()=>{
        const state = pc.iceConnectionState;
        if (state === 'connected' || state === 'completed') {
          clearViewerRecovery();
        } else if (state === 'disconnected') {
          scheduleViewerRecovery(pc, ICE_DISCONNECT_GRACE_MS);
        } else if (state === 'failed') {
          scheduleViewerRecovery(pc, 0);
        } else if (state === 'closed' && peerConnection === pc) {
          clearViewerRecovery();
        }
      };
      adoptPendingCandidates(pendingViewerCandidates, targetId, pc);
      return pc;
    }

    // Streamer peer: sends the capture to exactly one viewer.
    function createStreamerPeerConnection(viewerId, connectionId){
      const pc = new RTCPeerConnection({
        iceServers: [{ urls: ['stun:stun.l.google.com:19302'] }]
      });
      pc.northstarConnectionId = normalizeConnectionId(connectionId);
      pc.onicecandidate = (event)=>{
        if(event.candidate && viewerId){
          socket.send(JSON.stringify({
            type:'candidate',
            candidate:event.candidate,
            negotiationId: pc.northstarNegotiationId,
            connectionId: pc.northstarConnectionId,
            to: viewerId,
            from: clientId
          }));
        }
      };
      pc.oniceconnectionstatechange = ()=>{
        const state = pc.iceConnectionState;
        if (state === 'connected' || state === 'completed') {
          clearStreamerRecovery(viewerId);
          startAdaptiveQuality(viewerId, pc);
        } else if (state === 'disconnected') {
          stopAdaptiveQuality(viewerId, pc);
          scheduleStreamerRecovery(viewerId, pc, ICE_DISCONNECT_GRACE_MS);
        } else if (state === 'failed') {
          stopAdaptiveQuality(viewerId, pc);
          scheduleStreamerRecovery(viewerId, pc, 0);
        } else if (state === 'closed') {
          closeStreamerPeer(viewerId, pc);
        }
      };
      adoptPendingCandidates(pendingStreamerCandidates, viewerId, pc);
      return pc;
    }

    /*
     * Remote ICE candidate queue
     * --------------------------
     * Trickle ICE may reach the browser before its peer exists or while
     * setRemoteDescription() is still pending. Candidates stay ordered and are
     * drained only when both their connection and negotiation generations match.
     */
    function getCandidateState(pc){
      let state = candidateStates.get(pc);
      if (!state) {
        state = {
          activeNegotiationId: LEGACY_NEGOTIATION_ID,
          activeConnectionId: LEGACY_CONNECTION_ID,
          awaitingRemoteDescription: false,
          draining: false,
          queue: []
        };
        candidateStates.set(pc, state);
      }
      return state;
    }

    function normalizeNegotiationId(negotiationId){
      return typeof negotiationId === 'string' && negotiationId.length > 0 && negotiationId.length <= 128
        ? negotiationId
        : LEGACY_NEGOTIATION_ID;
    }

    function normalizeConnectionId(connectionId){
      return typeof connectionId === 'string' && connectionId.length > 0 && connectionId.length <= 128
        ? connectionId
        : LEGACY_CONNECTION_ID;
    }

    function createNegotiationId(){
      negotiationCounter += 1;
      return `${clientId || 'streamer'}-${Date.now().toString(36)}-${negotiationCounter.toString(36)}`;
    }

    function createConnectionId(){
      connectionCounter += 1;
      return `${clientId || 'client'}-pc-${Date.now().toString(36)}-${connectionCounter.toString(36)}`;
    }

    function candidateBelongsToConnection(connectionId, pc){
      if (!pc || !connectionId || !pc.northstarConnectionId) return true;
      return normalizeConnectionId(connectionId) === pc.northstarConnectionId;
    }

    function candidateMatchesNegotiation(candidateRecord, negotiationId){
      return candidateRecord.negotiationId === negotiationId
        || candidateRecord.negotiationId === LEGACY_NEGOTIATION_ID
        || negotiationId === LEGACY_NEGOTIATION_ID;
    }

    function candidateMatchesConnection(candidateRecord, connectionId){
      return candidateRecord.connectionId === connectionId
        || candidateRecord.connectionId === LEGACY_CONNECTION_ID
        || connectionId === LEGACY_CONNECTION_ID;
    }

    function appendCandidate(queue, candidateRecord, label){
      if (queue.length >= MAX_PENDING_ICE_CANDIDATES) {
        console.warn(`Dropping excess ICE candidate from ${label}`);
        return false;
      }
      queue.push(candidateRecord);
      return true;
    }

    function adoptPendingCandidates(pendingCandidates, peerId, pc){
      if (!peerId) return;
      const queued = pendingCandidates.get(peerId);
      if (!queued || !queued.length) return;
      pendingCandidates.delete(peerId);
      const state = getCandidateState(pc);
      for (const candidateRecord of queued) {
        appendCandidate(state.queue, candidateRecord, peerId);
      }
    }

    function takeCandidatesForNegotiation(pc, negotiationId, connectionId){
      if (!pc) return [];
      const state = getCandidateState(pc);
      const normalizedId = normalizeNegotiationId(negotiationId);
      const normalizedConnectionId = normalizeConnectionId(connectionId);
      const selected = [];
      state.queue = state.queue.filter(candidateRecord => {
        if (
          !candidateMatchesNegotiation(candidateRecord, normalizedId)
          || !candidateMatchesConnection(candidateRecord, normalizedConnectionId)
        ) return true;
        selected.push(candidateRecord);
        return false;
      });
      return selected;
    }

    function appendCandidatesToConnection(pc, candidateRecords, label){
      if (!candidateRecords.length) return;
      const state = getCandidateState(pc);
      for (const candidateRecord of candidateRecords) {
        appendCandidate(state.queue, candidateRecord, label);
      }
    }

    function clearCandidateState(pc){
      if (!pc) return;
      const state = candidateStates.get(pc);
      if (state) state.queue.length = 0;
      candidateStates.delete(pc);
    }

    function markAwaitingRemoteDescription(pc, negotiationId, connectionId){
      const state = getCandidateState(pc);
      state.activeNegotiationId = normalizeNegotiationId(negotiationId);
      state.activeConnectionId = normalizeConnectionId(connectionId);
      state.awaitingRemoteDescription = true;
    }

    // Accept, validate, and queue a remote candidate; never apply it early.
    async function receiveRemoteCandidate({
      candidateInit,
      label,
      negotiationId,
      connectionId,
      pc,
      pendingCandidates,
      peerId
    }){
      let candidate;
      try {
        candidate = new RTCIceCandidate(candidateInit);
      } catch (error) {
        console.warn(`Ignoring invalid ICE candidate from ${label}`, error);
        return;
      }
      const candidateRecord = {
        candidate,
        negotiationId: normalizeNegotiationId(negotiationId),
        connectionId: normalizeConnectionId(connectionId)
      };

      if (!pc || pc.signalingState === 'closed') {
        let queue = pendingCandidates.get(peerId);
        if (!queue) {
          queue = [];
          pendingCandidates.set(peerId, queue);
        }
        appendCandidate(queue, candidateRecord, label);
        return;
      }

      const state = getCandidateState(pc);
      if (!appendCandidate(state.queue, candidateRecord, label)) return;
      await drainRemoteCandidates(pc, label);
    }

    // Serialize addIceCandidate() calls to preserve signaling arrival order.
    async function drainRemoteCandidates(pc, label){
      const state = getCandidateState(pc);
      if (
        state.draining
        || state.awaitingRemoteDescription
        || !pc.remoteDescription
        || pc.signalingState === 'closed'
      ) return;

      state.draining = true;
      try {
        while (
          state.queue.length
          && !state.awaitingRemoteDescription
          && pc.remoteDescription
          && pc.signalingState !== 'closed'
        ) {
          const candidateIndex = state.queue.findIndex(candidateRecord => (
            candidateMatchesNegotiation(candidateRecord, state.activeNegotiationId)
            && candidateMatchesConnection(candidateRecord, state.activeConnectionId)
          ));
          if (candidateIndex < 0) break;
          const [{ candidate }] = state.queue.splice(candidateIndex, 1);
          try {
            await pc.addIceCandidate(candidate);
          } catch (error) {
            console.warn(`Ignoring ICE candidate that could not be applied for ${label}`, error);
          }
        }
      } finally {
        state.draining = false;
      }
    }

    // Installing the SDP and draining its candidates is one ordered operation.
    async function setRemoteDescriptionAndDrainCandidates(
      pc,
      description,
      label,
      negotiationId,
      connectionId
    ){
      const state = getCandidateState(pc);
      state.activeNegotiationId = normalizeNegotiationId(negotiationId);
      state.activeConnectionId = normalizeConnectionId(connectionId);
      state.awaitingRemoteDescription = true;
      try {
        await pc.setRemoteDescription(description);
      } catch (error) {
        // Retain queued candidates for the next valid description rather than
        // applying them against an older ICE generation.
        throw error;
      }
      state.awaitingRemoteDescription = false;
      await drainRemoteCandidates(pc, label);
    }

    /*
     * Connection recovery and offer serialization
     * -------------------------------------------
     * `disconnected` gets a grace period because it may recover on its own.
     * `failed` restarts ICE immediately. If restart negotiation cannot settle,
     * Northstar replaces only that viewer's connection.
     */
    function clearStreamerRecovery(viewerId){
      const timer = streamerRecoveryTimers.get(viewerId);
      if (timer) clearTimeout(timer);
      streamerRecoveryTimers.delete(viewerId);
    }

    function scheduleStreamerRecovery(
      viewerId,
      pc,
      delay,
      { replaceOutstanding = false } = {}
    ){
      if (peerConnections.get(viewerId) !== pc || pc.signalingState === 'closed') return;
      const existingTimer = streamerRecoveryTimers.get(viewerId);
      if (existingTimer) clearTimeout(existingTimer);

      const timer = setTimeout(async ()=>{
        streamerRecoveryTimers.delete(viewerId);
        if (peerConnections.get(viewerId) !== pc || pc.signalingState === 'closed') return;
        if (['connected', 'completed'].includes(pc.iceConnectionState)) return;
        await restartStreamerIce(viewerId, pc, { replaceOutstanding });
      }, delay);
      streamerRecoveryTimers.set(viewerId, timer);
    }

    // Duplicate requests join the active promise instead of racing createOffer().
    function runStreamerNegotiation(viewerId, kind, operation){
      const active = streamerNegotiationTasks.get(viewerId);
      if (active) {
        if (kind === 'ice-restart' && active.kind !== 'ice-restart') {
          pendingStreamerIceRestarts.add(viewerId);
        }
        return active.promise;
      }

      const task = { kind, promise: null };
      task.promise = Promise.resolve().then(operation);
      streamerNegotiationTasks.set(viewerId, task);

      const finish = ()=>{
        if (streamerNegotiationTasks.get(viewerId) !== task) return;
        streamerNegotiationTasks.delete(viewerId);
        const currentPc = peerConnections.get(viewerId);
        if (
          pendingStreamerIceRestarts.has(viewerId)
          && currentPc
          && currentPc.signalingState === 'stable'
          && !currentPc.northstarNegotiationInProgress
        ) {
          pendingStreamerIceRestarts.delete(viewerId);
          void restartStreamerIce(viewerId, currentPc);
        }
      };
      task.promise.then(finish, finish);
      return task.promise;
    }

    function restartStreamerIce(viewerId, pc, options = {}){
      if (peerConnections.get(viewerId) !== pc || pc.signalingState === 'closed') return;
      return runStreamerNegotiation(
        viewerId,
        'ice-restart',
        () => restartStreamerIceUnlocked(viewerId, pc, options)
      );
    }

    async function restartStreamerIceUnlocked(
      viewerId,
      pc,
      { replaceOutstanding = false } = {}
    ){
      if (peerConnections.get(viewerId) !== pc || pc.signalingState === 'closed') return;
      try {
        if (pc.northstarNegotiationInProgress) {
          if (replaceOutstanding) {
            console.warn(`Peer ${viewerId} did not answer the ICE restart; rebuilding connection`);
            await buildAndSendOfferForViewerUnlocked(viewerId, { replaceInProgress: true });
            return;
          }
          if (pc.northstarNegotiationKind !== 'ice-restart') {
            pendingStreamerIceRestarts.add(viewerId);
          }
          return;
        }
        if (pc.signalingState !== 'stable') {
          console.warn(`Peer ${viewerId} cannot restart ICE from ${pc.signalingState}; rebuilding connection`);
          await buildAndSendOfferForViewerUnlocked(viewerId, { replaceInProgress: true });
          return;
        }

        if (typeof pc.restartIce === 'function') pc.restartIce();
        const negotiationId = createNegotiationId();
        pc.northstarNegotiationId = negotiationId;
        pc.northstarNegotiationInProgress = true;
        pc.northstarNegotiationKind = 'ice-restart';
        markAwaitingRemoteDescription(pc, negotiationId, pc.northstarConnectionId);
        const offer = await pc.createOffer({ iceRestart: true });
        if (peerConnections.get(viewerId) !== pc || pc.signalingState === 'closed') return;
        await pc.setLocalDescription(offer);
        if (peerConnections.get(viewerId) !== pc) return;

        socket.send(JSON.stringify({
          type: 'offer',
          offer: pc.localDescription || offer,
          iceRestart: true,
          negotiationId,
          connectionId: pc.northstarConnectionId,
          to: viewerId,
          from: clientId
        }));
        scheduleStreamerRecovery(
          viewerId,
          pc,
          ICE_RESTART_RETRY_MS,
          { replaceOutstanding: true }
        );
      } catch (error) {
        console.warn(`ICE restart failed for peer ${viewerId}; rebuilding connection`, error);
        if (peerConnections.get(viewerId) === pc && localStream) {
          try {
            await buildAndSendOfferForViewerUnlocked(viewerId, { replaceInProgress: true });
          } catch (rebuildError) {
            console.warn(`Failed to rebuild connection for peer ${viewerId}`, rebuildError);
          }
        }
      }
    }

    function closeStreamerPeer(
      viewerId,
      expectedPc = null,
      { retireConnection = true } = {}
    ){
      const pc = peerConnections.get(viewerId);
      if (expectedPc && pc !== expectedPc) return;
      clearStreamerRecovery(viewerId);
      stopAdaptiveQuality(viewerId, pc);
      pendingStreamerIceRestarts.delete(viewerId);
      pendingStreamerCandidates.delete(viewerId);
      if (!pc) return;
      if (retireConnection) {
        rememberRetiredStreamerConnection(viewerId, pc.northstarConnectionId);
      }
      peerConnections.delete(viewerId);
      clearCandidateState(pc);
      senderAdaptationStates.delete(pc);
      try { pc.close(); } catch {}
    }

    function closeAllStreamerPeers(){
      for (const viewerId of Array.from(peerConnections.keys())) {
        closeStreamerPeer(viewerId);
      }
      pendingStreamerCandidates.clear();
      pendingStreamerIceRestarts.clear();
      retiredStreamerConnectionIds.clear();
    }

    // Invalidate queued viewer offers before releasing the current viewer peer.
    function cleanupViewerConnection(){
      viewerOfferEpoch += 1;
      requestedViewerConnectionId = null;
      clearViewerRecovery();
      if (peerConnection) {
        clearCandidateState(peerConnection);
        try { peerConnection.close(); } catch {}
        peerConnection = null;
      }
      pendingViewerCandidates.clear();
      retiredViewerConnectionIds.clear();
      remoteEl.srcObject = null;
      remoteEl.classList.add('hidden');
      liveBadge.hidden = true;
      streamerId = null;
    }

    function clearViewerRecovery(){
      if (viewerRecoveryTimer) clearTimeout(viewerRecoveryTimer);
      viewerRecoveryTimer = null;
    }

    function scheduleViewerRecovery(pc, delay){
      if (peerConnection !== pc || pc.signalingState === 'closed') return;
      clearViewerRecovery();
      viewerRecoveryTimer = setTimeout(()=>{
        viewerRecoveryTimer = null;
        if (peerConnection !== pc || pc.signalingState === 'closed') return;
        if (['connected', 'completed'].includes(pc.iceConnectionState)) return;
        requestOfferFromStreamer({ iceRestart: true });
        scheduleViewerRecovery(pc, ICE_RESTART_RETRY_MS);
      }, delay);
    }

    // Viewer-side SDP operations are chained so two offers cannot overlap.
    function queueViewerOffer(offer, options){
      const queuedEpoch = viewerOfferEpoch;
      const queuedOffer = viewerOfferChain.then(() => {
        if (queuedEpoch !== viewerOfferEpoch || role !== 'viewer') return;
        return handleViewerOffer(offer, options);
      });
      viewerOfferChain = queuedOffer.catch(error => {
        console.warn('Failed to process queued offer', error);
      });
      return viewerOfferChain;
    }

    // Retired histories are bounded: enough for delayed packets, not unbounded state.
    function rememberRetiredViewerConnection(connectionId){
      if (!connectionId || connectionId === LEGACY_CONNECTION_ID) return;
      retiredViewerConnectionIds.add(connectionId);
      if (retiredViewerConnectionIds.size > 32) {
        retiredViewerConnectionIds.delete(retiredViewerConnectionIds.values().next().value);
      }
    }

    function rememberRetiredStreamerConnection(viewerId, connectionId){
      if (!viewerId || !connectionId || connectionId === LEGACY_CONNECTION_ID) return;
      let retiredIds = retiredStreamerConnectionIds.get(viewerId);
      if (!retiredIds) {
        retiredIds = new Set();
        retiredStreamerConnectionIds.set(viewerId, retiredIds);
      }
      retiredIds.add(connectionId);
      if (retiredIds.size > 32) {
        retiredIds.delete(retiredIds.values().next().value);
      }
    }

    function isRetiredStreamerConnection(viewerId, connectionId){
      return Boolean(connectionId && retiredStreamerConnectionIds.get(viewerId)?.has(connectionId));
    }

    async function handleViewerOffer(
      offer,
      { iceRestart = false, negotiationId, connectionId } = {}
    ){
      clearViewerRecovery();
      const normalizedNegotiationId = normalizeNegotiationId(negotiationId);
      const normalizedConnectionId = normalizeConnectionId(connectionId);
      if (retiredViewerConnectionIds.has(normalizedConnectionId)) {
        console.warn('Ignoring offer for a retired connection');
        return;
      }
      requestedViewerConnectionId = normalizedConnectionId;
      if (
        peerConnection
        && peerConnection.northstarConnectionId === normalizedConnectionId
        && peerConnection.northstarNegotiationId === normalizedNegotiationId
      ) {
        console.warn('Ignoring duplicate offer for the active negotiation');
        return;
      }
      const canReuseConnection = iceRestart
        && peerConnection
        && peerConnection.northstarConnectionId === normalizedConnectionId
        && peerConnection.signalingState === 'stable';

      if (!canReuseConnection) {
        const carriedCandidates = takeCandidatesForNegotiation(
          peerConnection,
          normalizedNegotiationId,
          normalizedConnectionId
        );
        if (peerConnection) {
          rememberRetiredViewerConnection(peerConnection.northstarConnectionId);
        }
        if (peerConnection && peerConnection.signalingState !== 'closed') {
          clearCandidateState(peerConnection);
          try { peerConnection.close(); } catch {}
        }
        for (const pendingId of pendingViewerCandidates.keys()) {
          if (pendingId !== streamerId) pendingViewerCandidates.delete(pendingId);
        }
        peerConnection = createViewerPeerConnection(streamerId, normalizedConnectionId);
        appendCandidatesToConnection(
          peerConnection,
          carriedCandidates,
          `streamer ${streamerId || 'unknown'}`
        );
      }
      peerConnection.northstarConnectionId = normalizedConnectionId;
      peerConnection.northstarNegotiationId = normalizedNegotiationId;
      const pc = peerConnection;
      await setRemoteDescriptionAndDrainCandidates(
        pc,
        new RTCSessionDescription(offer),
        `streamer ${streamerId || 'unknown'}`,
        normalizedNegotiationId,
        normalizedConnectionId
      );
      if (peerConnection !== pc || pc.signalingState === 'closed') return;
      const answer = await pc.createAnswer();
      if (peerConnection !== pc || pc.signalingState === 'closed') return;
      await pc.setLocalDescription(answer);
      if (peerConnection !== pc || pc.signalingState === 'closed') return;
      const payload = {
        type: 'answer',
        answer: pc.localDescription || answer,
        negotiationId: normalizedNegotiationId,
        connectionId: normalizedConnectionId,
        from: clientId
      };
      if (streamerId) payload.to = streamerId;
      socket.send(JSON.stringify(payload));
    }

    /*
     * Media/role lifecycle
     * --------------------
     * Valid paths are:
     *   idle -> capturing -> publishing -> stopping -> idle
     *   idle -> viewing -----------------> stopping -> idle
     *
     * Button presses set a desired mode. The reconciler serializes transitions,
     * which also handles a user changing modes while a permission prompt is open.
     */
    function setLifecycleState(nextState){
      const allowedTransitions = {
        [LIFECYCLE_STATES.IDLE]: [LIFECYCLE_STATES.CAPTURING, LIFECYCLE_STATES.VIEWING],
        [LIFECYCLE_STATES.CAPTURING]: [LIFECYCLE_STATES.PUBLISHING, LIFECYCLE_STATES.STOPPING],
        [LIFECYCLE_STATES.PUBLISHING]: [LIFECYCLE_STATES.STOPPING],
        [LIFECYCLE_STATES.VIEWING]: [LIFECYCLE_STATES.STOPPING],
        [LIFECYCLE_STATES.STOPPING]: [LIFECYCLE_STATES.IDLE]
      };
      if (
        nextState !== lifecycleState
        && !allowedTransitions[lifecycleState]?.includes(nextState)
      ) {
        throw new Error(`Invalid lifecycle transition: ${lifecycleState} -> ${nextState}`);
      }
      lifecycleState = nextState;
      bodyEl.dataset.lifecycleState = nextState;
    }

    function lifecycleMatchesRequestedMode(){
      return (
        (requestedLifecycleMode === LIFECYCLE_MODES.IDLE && lifecycleState === LIFECYCLE_STATES.IDLE)
        || (requestedLifecycleMode === LIFECYCLE_MODES.STREAMER && lifecycleState === LIFECYCLE_STATES.PUBLISHING)
        || (requestedLifecycleMode === LIFECYCLE_MODES.VIEWER && lifecycleState === LIFECYCLE_STATES.VIEWING)
      );
    }

    // Stop every owned track once, even if two MediaStreams reference the same track.
    function stopMediaTracks(...streams){
      const stoppedTracks = new Set();
      for (const stream of streams) {
        if (!stream || typeof stream.getTracks !== 'function') continue;
        for (const track of stream.getTracks()) {
          if (stoppedTracks.has(track)) continue;
          stoppedTracks.add(track);
          try { track.stop(); } catch (error) {
            console.warn('Failed to stop media track', error);
          }
        }
      }
    }

    // This is the single teardown path for peers, timers, UI, and capture tracks.
    async function stopLifecycleResources(){
      if (lifecycleState === LIFECYCLE_STATES.IDLE) return;
      setLifecycleState(LIFECYCLE_STATES.STOPPING);
      activeCaptureGeneration = 0;

      role = null;
      sendRoleState();
      closeAllStreamerPeers();
      cleanupViewerConnection();

      const displayStream = localStream;
      const microphoneStream = micStream;
      localStream = null;
      micStream = null;
      localEl.srcObject = null;
      stopMediaTracks(displayStream, microphoneStream);

      localEl.classList.add('hidden');
      remoteEl.classList.add('hidden');
      liveBadge.hidden = true;
      streamerId = null;
      setLifecycleState(LIFECYCLE_STATES.IDLE);
    }

    function enterViewerMode(){
      setLifecycleState(LIFECYCLE_STATES.VIEWING);
      role = 'viewer';
      streamerId = null;
      sendRoleState();
      localEl.srcObject = null;
      localEl.classList.add('hidden');
      remoteEl.classList.add('hidden');
      liveBadge.hidden = true;
      requestOfferFromStreamer();
    }

    async function captureAndPublish(){
      setLifecycleState(LIFECYCLE_STATES.CAPTURING);
      closeSettingsPanel();
      currentQualityProfile = QUALITY_PROFILES[qualitySelect?.value] || QUALITY_PROFILES['720p60'];
      currentCodecPreference = codecSelect?.value || 'auto';
      const qualityConstraints = buildQualityConstraints(currentQualityProfile);
      const thisCaptureGeneration = ++captureGeneration;
      activeCaptureGeneration = thisCaptureGeneration;
      let displayStream = null;
      let microphoneStream = null;

      try {
        displayStream = await navigator.mediaDevices.getDisplayMedia({
          video: { ...qualityConstraints.video, cursor: 'always' },
          audio: true
        });

        for (const track of displayStream.getVideoTracks()) {
          // Browser chrome's "Stop sharing" must follow the same teardown path.
          track.addEventListener('ended', ()=>{
            if (activeCaptureGeneration !== thisCaptureGeneration) return;
            requestLifecycleMode(LIFECYCLE_MODES.IDLE);
          }, { once: true });
        }

        if (
          requestedLifecycleMode !== LIFECYCLE_MODES.STREAMER
          || activeCaptureGeneration !== thisCaptureGeneration
        ) {
          stopMediaTracks(displayStream);
          return;
        }

        try {
          // Request mic audio so viewers hear commentary in addition to the screen share.
          microphoneStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: true,
              noiseSuppression: true,
              sampleRate: 48000
            }
          });
        } catch (error) {
          console.warn('Microphone capture failed or was denied', error);
        }

        if (
          requestedLifecycleMode !== LIFECYCLE_MODES.STREAMER
          || activeCaptureGeneration !== thisCaptureGeneration
        ) {
          stopMediaTracks(displayStream, microphoneStream);
          return;
        }

        const videoTrack = displayStream.getVideoTracks()[0] || null;
        if (videoTrack) {
          if ('contentHint' in videoTrack) {
            videoTrack.contentHint = contentHintSelect.value; // 'motion' | 'detail'
          }
          await applyQualityConstraints(videoTrack, currentQualityProfile);
        }

        if (
          requestedLifecycleMode !== LIFECYCLE_MODES.STREAMER
          || activeCaptureGeneration !== thisCaptureGeneration
          || videoTrack?.readyState === 'ended'
        ) {
          stopMediaTracks(displayStream, microphoneStream);
          return;
        }

        localStream = displayStream;
        micStream = microphoneStream;
        role = 'streamer';
        streamerId = null;
        setLifecycleState(LIFECYCLE_STATES.PUBLISHING);
        sendRoleState();

        localEl.srcObject = localStream;
        localEl.classList.remove('hidden');
        remoteEl.classList.add('hidden');
        liveBadge.hidden = false;
      } catch (error) {
        stopMediaTracks(displayStream, microphoneStream);
        if (activeCaptureGeneration === thisCaptureGeneration) {
          activeCaptureGeneration = 0;
        }
        if (requestedLifecycleMode === LIFECYCLE_MODES.STREAMER) {
          requestedLifecycleMode = LIFECYCLE_MODES.IDLE;
          console.error('Failed to start streaming', error);
          const message = error?.name === 'NotAllowedError'
            ? 'Screen share permission was denied. Please allow access and try again.'
            : 'Unable to start screen sharing. Verify HTTPS is enabled and browser permissions are granted.';
          alert(message);
        }
      }
    }

    // Move through stopping/idle as needed until actual state equals desired mode.
    async function reconcileLifecycle(){
      while (!lifecycleMatchesRequestedMode()) {
        if (lifecycleState !== LIFECYCLE_STATES.IDLE) {
          await stopLifecycleResources();
          continue;
        }
        if (requestedLifecycleMode === LIFECYCLE_MODES.VIEWER) {
          enterViewerMode();
          continue;
        }
        if (requestedLifecycleMode === LIFECYCLE_MODES.STREAMER) {
          await captureAndPublish();
          continue;
        }
      }
    }

    function requestLifecycleMode(mode){
      requestedLifecycleMode = mode;
      if (!lifecycleTask) {
        lifecycleTask = reconcileLifecycle()
          .catch(async error => {
            console.error('Lifecycle transition failed', error);
            requestedLifecycleMode = LIFECYCLE_MODES.IDLE;
            try { await stopLifecycleResources(); } catch {}
          })
          .finally(()=>{
            lifecycleTask = null;
            if (!lifecycleMatchesRequestedMode()) {
              requestLifecycleMode(requestedLifecycleMode);
            }
          });
      }
      return lifecycleTask;
    }

    function startStreamer(){
      if (!SECURE_CONTEXT_OK) {
        if (!screenShareAlertShown) {
          alert('Screen sharing requires a secure context (HTTPS or localhost). Enable HTTPS on the host and reload.');
          screenShareAlertShown = true;
        }
        return Promise.resolve();
      }
      return requestLifecycleMode(LIFECYCLE_MODES.STREAMER);
    }

    function startViewer(){
      return requestLifecycleMode(LIFECYCLE_MODES.VIEWER);
    }

    function stopAll(){
      return requestLifecycleMode(LIFECYCLE_MODES.IDLE);
    }

    function buildQualityConstraints(profile){
      return {
        video: {
          frameRate: profile?.frameRate ? { ideal: profile.frameRate, max: profile.frameRate } : undefined,
          width: profile?.width ? { ideal: profile.width, max: profile.width } : undefined,
          height: profile?.height ? { ideal: profile.height, max: profile.height } : undefined
        }
      };
    }

    async function applyQualityConstraints(track, profile){
      if (!track || typeof track.applyConstraints !== 'function') return;
      const constraints = {};
      if (profile?.width) constraints.width = profile.width;
      if (profile?.height) constraints.height = profile.height;
      if (profile?.frameRate) constraints.frameRate = { ideal: profile.frameRate, max: profile.frameRate };
      try{
        await track.applyConstraints(constraints);
      }catch(e){
        console.warn('applyConstraints failed, stream may exceed target profile', e);
      }
    }

    async function applyCodecPreference(pc, codecKey){
      if (!pc || typeof RTCRtpSender === 'undefined' || !RTCRtpSender.getCapabilities) return;
      const mime = CODEC_PREFERENCES[codecKey];
      if (!mime) return;
      const capabilities = RTCRtpSender.getCapabilities('video');
      if (!capabilities || !capabilities.codecs || !capabilities.codecs.length) return;
      const lowerMime = mime.toLowerCase();
      const preferred = capabilities.codecs.filter(c => c.mimeType.toLowerCase() === lowerMime);
      if (!preferred.length) {
        console.warn(`Codec ${mime} not supported on this browser`);
        return;
      }
      const others = capabilities.codecs.filter(c => c.mimeType.toLowerCase() !== lowerMime);
      const order = [...preferred, ...others];
      pc.getTransceivers().forEach(trans => {
        if (trans.sender?.track?.kind === 'video' && typeof trans.setCodecPreferences === 'function') {
          try {
            trans.setCodecPreferences(order);
          } catch (e) {
            console.warn('Failed to apply codec preferences', e);
          }
        }
      });
    }

    /*
     * Offer creation
     * --------------
     * A new viewer connection gets a fresh connectionId and its first
     * negotiationId. Every await is followed by an ownership check so work from
     * a closed/replaced peer cannot send a stale offer.
     */
    function buildAndSendOfferForViewer(viewerId, options = {}){
      if (!localStream || !viewerId) return;
      return runStreamerNegotiation(
        viewerId,
        'new-connection',
        () => buildAndSendOfferForViewerUnlocked(viewerId, options)
      );
    }

    async function buildAndSendOfferForViewerUnlocked(
      viewerId,
      { replaceInProgress = false, requestedConnectionId = null } = {}
    ){
      if (!localStream || !viewerId) return;
      const videoTrack = localStream.getVideoTracks()[0] || null;

      const existing = peerConnections.get(viewerId);
      const normalizedRequestedConnectionId = requestedConnectionId
        ? normalizeConnectionId(requestedConnectionId)
        : null;
      if (isRetiredStreamerConnection(viewerId, normalizedRequestedConnectionId)) {
        console.warn(`Ignoring request for a retired connection from viewer ${viewerId}`);
        return;
      }
      if (
        existing
        && normalizedRequestedConnectionId
        && existing.northstarConnectionId === normalizedRequestedConnectionId
        && !replaceInProgress
      ) {
        return;
      }
      if (existing?.northstarNegotiationInProgress && !replaceInProgress) {
        return;
      }
      if (existing) {
        closeStreamerPeer(viewerId, existing);
      }

      const connectionId = normalizedRequestedConnectionId || createConnectionId();
      const pc = createStreamerPeerConnection(viewerId, connectionId);
      peerConnections.set(viewerId, pc);
      try {
        getOutboundTracks().forEach(({ track, stream }) => pc.addTrack(track, stream));
        await applyCodecPreference(pc, currentCodecPreference);
        resetSenderAdaptation(pc, currentQualityProfile);
        await tuneSenderParams(pc, currentQualityProfile, videoTrack);
        if (peerConnections.get(viewerId) !== pc || pc.signalingState === 'closed') return;

        const negotiationId = createNegotiationId();
        pc.northstarNegotiationId = negotiationId;
        pc.northstarNegotiationInProgress = true;
        pc.northstarNegotiationKind = 'new-connection';
        markAwaitingRemoteDescription(pc, negotiationId, connectionId);
        const offer = await pc.createOffer();
        if (peerConnections.get(viewerId) !== pc || pc.signalingState === 'closed') return;
        await pc.setLocalDescription(offer);
        if (peerConnections.get(viewerId) !== pc || pc.signalingState === 'closed') return;
        socket.send(JSON.stringify({
          type:'offer',
          offer: pc.localDescription || offer,
          iceRestart: false,
          negotiationId,
          connectionId,
          to: viewerId,
          from: clientId
        }));
      } catch (error) {
        if (peerConnections.get(viewerId) === pc) {
          closeStreamerPeer(viewerId, pc, { retireConnection: false });
        }
        console.warn(`Failed to create offer for viewer ${viewerId}`, error);
      }
    }

    // Ask the active streamer for an initial offer or an in-place ICE restart.
    function requestOfferFromStreamer({ iceRestart = false } = {}){
      const payload = { type: 'request-offer', iceRestart };
      if (iceRestart) {
        if (peerConnection?.northstarConnectionId) {
          payload.connectionId = peerConnection.northstarConnectionId;
        }
      } else {
        if (!requestedViewerConnectionId) {
          requestedViewerConnectionId = createConnectionId();
        }
        payload.connectionId = requestedViewerConnectionId;
      }
      if (clientId) payload.viewerId = clientId;
      if (!socket) return;
      if (socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(payload));
      } else if (socket.readyState === WebSocket.CONNECTING) {
        const once = () => {
          if (socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(payload));
        };
        socket.addEventListener('open', once, { once: true });
      } else if (iceRestart) {
        console.warn('Cannot request ICE restart because signaling is disconnected');
      }
    }

    /*
     * Per-viewer quality adaptation
     * -----------------------------
     * The selected profile is a ceiling, not a promised bitrate. Every three
     * seconds, each connected peer samples WebRTC stats. Loss, high RTT, or a
     * low available-outgoing-bitrate estimate lowers that peer's maxBitrate;
     * two healthy samples are required before a gradual increase.
     *
     * Motion mode protects frame rate and may scale resolution down. Detail mode
     * protects resolution and lets the browser reduce frame rate under pressure.
     */
    function getDegradationPreference(profile){
      if (contentHintSelect?.value === 'motion') return 'maintain-framerate';
      if (contentHintSelect?.value === 'detail') return 'maintain-resolution';
      return profile?.degradationPreference || 'balanced';
    }

    function getBaseResolutionScale(track, profile){
      if (!track || typeof track.getSettings !== 'function' || !profile?.width) return 1;
      const sourceWidth = track.getSettings()?.width;
      if (!sourceWidth || sourceWidth <= profile.width) return 1;
      return Math.max(1, sourceWidth / profile.width);
    }

    function getAdaptiveResolutionScale(profile, track, maxBitrate){
      const baseScale = getBaseResolutionScale(track, profile);
      const ceiling = profile?.maxBitrate || maxBitrate;
      if (!ceiling || !maxBitrate) return baseScale;
      const bitrateRatio = maxBitrate / ceiling;
      const preference = getDegradationPreference(profile);
      let adaptiveScale = 1;

      if (preference === 'maintain-framerate') {
        if (bitrateRatio < 0.45) adaptiveScale = 2;
        else if (bitrateRatio < 0.7) adaptiveScale = 1.5;
      } else if (preference === 'balanced' && bitrateRatio < 0.4) {
        adaptiveScale = 1.5;
      }
      return Math.max(1, Math.min(4, baseScale * adaptiveScale));
    }

    // RTCRtpSender.setParameters() calls must not overlap for the same sender.
    function queueSenderParameterUpdate(sender, update){
      const previousTask = senderParameterTasks.get(sender) || Promise.resolve();
      const task = previousTask.catch(()=>{}).then(async ()=>{
        const params = sender.getParameters();
        if (!params.encodings?.length) {
          console.warn('Cannot tune sender before an RTP encoding is available');
          return false;
        }
        update(params, params.encodings[0]);
        await sender.setParameters(params);
        return true;
      });
      senderParameterTasks.set(sender, task);
      const clearTask = ()=>{
        if (senderParameterTasks.get(sender) === task) senderParameterTasks.delete(sender);
      };
      task.then(clearTask, clearTask);
      return task;
    }

    async function tuneSenderParams(
      pc,
      profile,
      track,
      { maxBitrate = profile?.maxBitrate } = {}
    ){
      const sender = pc?.getSenders().find(candidate => candidate.track?.kind === 'video');
      if (!sender || !maxBitrate) return false;
      const resolutionScale = getAdaptiveResolutionScale(profile, track, maxBitrate);

      try {
        const applied = await queueSenderParameterUpdate(sender, (params, encoding)=>{
          encoding.maxBitrate = Math.max(1, Math.round(maxBitrate));
          if (profile?.frameRate) encoding.maxFramerate = profile.frameRate;
          encoding.scaleResolutionDownBy = resolutionScale;
          params.degradationPreference = getDegradationPreference(profile);
          encoding.priority = 'high';
          encoding.networkPriority = 'high';
        });
        const adaptationState = senderAdaptationStates.get(pc);
        if (applied && adaptationState?.profile === profile) {
          adaptationState.parametersApplied = true;
        }
        return applied;
      } catch (error) {
        console.warn('setParameters failed', error);
        return false;
      }
    }

    function resetSenderAdaptation(pc, profile){
      if (!pc || !profile) return;
      senderAdaptationStates.set(pc, {
        profile,
        currentBitrate: profile.maxBitrate,
        healthySamples: 0,
        adapting: false,
        parametersApplied: false
      });
    }

    // Normalize browser stats into the three signals used by the controller.
    function readNetworkQuality(stats){
      let selectedPairId = null;
      let fallbackPair = null;
      let fractionLost = null;
      let roundTripTime = null;

      stats.forEach(report => {
        if (report.type === 'transport' && report.selectedCandidatePairId) {
          selectedPairId = report.selectedCandidatePairId;
        }
        if (
          report.type === 'candidate-pair'
          && report.state === 'succeeded'
          && report.nominated
        ) {
          fallbackPair = report;
        }
        if (
          report.type === 'remote-inbound-rtp'
          && (report.kind === 'video' || report.mediaType === 'video')
        ) {
          if (Number.isFinite(report.fractionLost)) {
            fractionLost = Math.max(fractionLost || 0, report.fractionLost);
          }
          if (Number.isFinite(report.roundTripTime)) {
            roundTripTime = Math.max(roundTripTime || 0, report.roundTripTime);
          }
        }
      });

      const selectedPair = (selectedPairId && stats.get?.(selectedPairId)) || fallbackPair;
      const availableOutgoingBitrate = Number.isFinite(selectedPair?.availableOutgoingBitrate)
        ? selectedPair.availableOutgoingBitrate
        : null;
      return { availableOutgoingBitrate, fractionLost, roundTripTime };
    }

    // Multiplicative decrease plus conservative additive recovery avoids oscillation.
    function chooseAdaptiveBitrate(profile, state, networkQuality){
      const ceiling = profile.maxBitrate;
      const floor = Math.min(ceiling, profile.adaptiveFloor || 500_000);
      const current = Math.max(floor, Math.min(ceiling, state.currentBitrate || ceiling));
      const { availableOutgoingBitrate, fractionLost, roundTripTime } = networkQuality;
      const capacityCeiling = availableOutgoingBitrate !== null
        ? Math.max(floor, availableOutgoingBitrate * QUALITY_ADAPTATION_HEADROOM)
        : null;
      const severePressure = (fractionLost !== null && fractionLost >= 0.08)
        || (roundTripTime !== null && roundTripTime >= 0.45);
      const moderatePressure = (fractionLost !== null && fractionLost >= 0.03)
        || (roundTripTime !== null && roundTripTime >= 0.3)
        || (capacityCeiling !== null && capacityCeiling < current * 0.9);

      if (severePressure || moderatePressure) {
        state.healthySamples = 0;
        const reduction = severePressure ? 0.7 : 0.85;
        const reduced = current * reduction;
        return Math.round(Math.max(floor, Math.min(reduced, capacityCeiling || ceiling)));
      }

      state.healthySamples += 1;
      if (state.healthySamples < 2 || current >= ceiling) return Math.round(current);
      state.healthySamples = 0;
      const increase = Math.max(250_000, current * 0.12);
      return Math.round(Math.min(ceiling, current + increase));
    }

    async function adaptSenderQuality(viewerId, pc){
      if (
        peerConnections.get(viewerId) !== pc
        || !['connected', 'completed'].includes(pc.iceConnectionState)
      ) return;
      const state = senderAdaptationStates.get(pc);
      if (!state || state.adapting || typeof pc.getStats !== 'function') return;
      state.adapting = true;

      try {
        const stats = await pc.getStats();
        if (
          peerConnections.get(viewerId) !== pc
          || senderAdaptationStates.get(pc) !== state
        ) return;
        const nextBitrate = chooseAdaptiveBitrate(state.profile, state, readNetworkQuality(stats));
        if (
          state.parametersApplied
          && Math.abs(nextBitrate - state.currentBitrate) < 100_000
        ) return;
        const track = localStream?.getVideoTracks()[0] || null;
        const applied = await tuneSenderParams(pc, state.profile, track, { maxBitrate: nextBitrate });
        if (applied) state.currentBitrate = nextBitrate;
      } catch (error) {
        console.warn(`Quality adaptation failed for viewer ${viewerId}`, error);
      } finally {
        state.adapting = false;
      }
    }

    function startAdaptiveQuality(viewerId, pc){
      const activeTimer = streamerQualityTimers.get(viewerId);
      if (activeTimer?.pc === pc) return;
      stopAdaptiveQuality(viewerId);
      const timer = setInterval(()=>{
        void adaptSenderQuality(viewerId, pc);
      }, QUALITY_ADAPTATION_INTERVAL_MS);
      streamerQualityTimers.set(viewerId, { pc, timer });
    }

    function stopAdaptiveQuality(viewerId, expectedPc = null){
      const activeTimer = streamerQualityTimers.get(viewerId);
      if (!activeTimer || (expectedPc && activeTimer.pc !== expectedPc)) return;
      clearInterval(activeTimer.timer);
      streamerQualityTimers.delete(viewerId);
    }

    function getOutboundTracks(){
      const tracks = [];
      if (localStream) {
        localStream.getTracks().forEach(track => tracks.push({ track, stream: localStream }));
      }
      if (micStream) {
        micStream.getAudioTracks().forEach(track => tracks.push({ track, stream: micStream }));
      }
      return tracks;
    }

    function appendMessage(msg){
      const p = document.createElement('p'); p.textContent = msg;
      chatMessages.appendChild(p); chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // Enter-to-send via form submit
    if (chatForm && chatInput) {
      chatForm.addEventListener('submit', (e)=>{ e.preventDefault(); sendMessage(); });
    }

    function sendMessage(){
      const message = chatInput.value.trim(); if(!message) return;
      socket.send(JSON.stringify({ type:'chat', message }));
      appendMessage(`You: ${message}`); chatInput.value = '';
    }

    // Allow live switching of contentHint while streaming
    contentHintSelect.addEventListener('change', async ()=>{
      if(!localStream) return;
      const vTrack = localStream.getVideoTracks()[0];
      if(vTrack && 'contentHint' in vTrack) vTrack.contentHint = contentHintSelect.value;
      if (role === 'streamer') {
        for (const pc of peerConnections.values()) {
          const state = senderAdaptationStates.get(pc);
          if (state) state.healthySamples = 0;
          await tuneSenderParams(pc, currentQualityProfile, vTrack, {
            maxBitrate: state?.currentBitrate || currentQualityProfile.maxBitrate
          });
        }
      }
    });
  </script>
</body>
